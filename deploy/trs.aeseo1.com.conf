# OpenLiteSpeed vhost cho trs.aeseo1.com.
# Dat tai: /usr/local/lsws/conf/vhosts/trs.aeseo1.com/trs.aeseo1.com.conf
#
# FastAPI tu phuc vu ca giao dien (/, /assets) lan API (/api), nen chi can MOT
# context proxy o goc. Khong tach docRoot tinh nhu bill/sm.

docRoot                   /usr/local/lsws/trs.aeseo1.com/html
vhDomain                  trs.aeseo1.com
enableGzip                1

accessControl  {
  allow                   *
}

extprocessor trs-backend {
  type                    proxy
  address                 http://127.0.0.1:8002
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# Giu /.well-known tro ve file that de certbot gia han duoc chung chi.
# Neu de context / nuot ca duong nay thi lan gia han sau se that bai am tham,
# den luc chung chi het han moi phat hien.
context /.well-known {
  location                /usr/local/lsws/trs.aeseo1.com/html/.well-known
  allowBrowse             1
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 trs-backend
  addDefaultCharset       off
}

# Chung chi nay CHI dung cho chang Cloudflare -> origin. Khach truy cap nhan
# chung chi cua Cloudflare o bien, nen van thay HTTPS hop le binh thuong.
# Tu ky vi Cloudflare tra 403 cho may chu xac thuc cua Let's Encrypt (da thu ca
# ban that lan ban staging) — chan o phia Cloudflare, khong sua duoc tu VPS.
# Giong het cach bill.aeseo1.com va sm.aeseo1.com dang chay tren may nay.
# Yeu cau: che do SSL cua Cloudflare la "Full", KHONG phai "Full (strict)".
vhssl  {
  keyFile                 /etc/wptt-ssl-tu-ky/trs.aeseo1.com/trs.aeseo1.com.key
  certFile                /etc/wptt-ssl-tu-ky/trs.aeseo1.com/cert.crt
  certChain               0
  sslProtocol             24
  renegProtection         1
  sslSessionCache         1
  sslSessionTickets       1
  enableSpdy              15
  enableQuic              1
}
